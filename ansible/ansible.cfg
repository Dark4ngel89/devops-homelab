# Ansible citește acest fișier doar când rulezi din folderul ansible/ (sau cu ANSIBLE_CONFIG).
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Verificarea cheii host-ului rămâne activă: fingerprint-urile sunt deja în ~/.ssh/known_hosts.
host_key_checking = True
# Fără warning la detectarea interpretorului Python de pe țintă.
interpreter_python = auto_silent
# Output lizibil (YAML) în loc de JSON pe o linie.
callback_result_format = yaml
# Arată cât durează fiecare task, la final.
callbacks_enabled = ansible.builtin.timer, ansible.posix.profile_tasks

[ssh_connection]
# Un singur SSH per task (fără copiere de fișier temporar): mult mai rapid.
pipelining = True
