apiVersion: v1
kind: Service
metadata:
  name: homelab-app
  namespace: homelab
  labels:
    app.kubernetes.io/name: homelab-app
spec:
  # NodePort doar pentru Faza 4, ca să testăm din WSL. În Faza 5 trecem pe ClusterIP + Ingress.
  type: NodePort
  # Service-ul trimite trafic la pod-urile cu acest label (și care sunt Ready).
  selector:
    app.kubernetes.io/name: homelab-app
  ports:
    - name: http
      port: 80          # portul Service-ului în cluster
      targetPort: http  # portul numit din container (8000)
      nodePort: 30080   # portul deschis pe node, accesibil din afara clusterului
