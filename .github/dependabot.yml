# Versiunile sunt fixate peste tot; Dependabot propune upgrade-urile ca PR-uri,
# iar CI-ul le testează înainte de merge.
version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    groups:
      python-deps:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
